<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 거래처 접수 및 처리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 실시간 새 접수 알람 토스트 팝업 -->
  <div id="toast-alert" class="fixed top-5 right-5 bg-indigo-600 text-white px-5 py-4 rounded-2xl shadow-2xl z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 flex items-center gap-3">
    <span class="text-2xl">🔔</span>
    <div>
      <h4 class="font-bold text-sm">새로운 접수가 등록되었습니다!</h4>
      <p id="toast-message" class="text-xs text-indigo-100 mt-0.5">거래처와 내용을 확인하세요.</p>
    </div>
  </div>

  <!-- 헤더 -->
  <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold tracking-tight">📋 실시간 거래처 접수 관리</h1>
        <button onclick="openConfigModal()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2 py-1 rounded transition text-indigo-100">⚙️ 서버설정</button>
      </div>
      <span id="connection-status" class="text-xs bg-indigo-500 px-2 py-1 rounded-full">서버 연결 대기 중...</span>
    </div>
  </header>

  <!-- 파이어베이스 설정 입력 모달 (최초 1회만 필요) -->
  <div id="config-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800">🛠️ 파이어베이스 서버 설정 (최초 1회)</h3>
      <p class="text-xs text-slate-500">Firebase 콘솔에서 발급받은 웹 앱 설정값을 한 번만 입력해 주세요. 이 기기에 안전하게 저장되어 코드가 바뀌어도 유지됩니다.</p>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">API Key (apiKey)</label>
          <input type="text" id="cfg-apiKey" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="AIzaSy...">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Auth Domain (authDomain)</label>
          <input type="text" id="cfg-authDomain" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="project.firebaseapp.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Project ID (projectId)</label>
          <input type="text" id="cfg-projectId" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="project-id">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Storage Bucket (storageBucket)</label>
          <input type="text" id="cfg-storageBucket" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="project.appspot.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Messaging Sender ID (messagingSenderId)</label>
          <input type="text" id="cfg-messagingSenderId" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="123456789">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">App ID (appId)</label>
          <input type="text" id="cfg-appId" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="1:123:web:abc">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveConfig()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">저장 및 연결하기</button>
        <button onclick="closeConfigModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm transition">닫기</button>
      </div>
    </div>
  </div>

  <!-- 상세 페이지 (상세 처리 내역 모달) -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-client-title" class="text-lg font-bold text-slate-800">📋 상세 처리 내역</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <!-- 기본 정보 표시 -->
      <div class="bg-slate-50 p-3 rounded-xl space-y-1 text-sm">
        <p><strong>거래처:</strong> <span id="modal-client-name">-</span></p>
        <p><strong>접수내용:</strong> <span id="modal-client-content">-</span></p>
        <p><strong>연락처:</strong> <span id="modal-client-contact">-</span></p>
        <p><strong>접수시간:</strong> <span id="modal-client-time">-</span></p>
      </div>

      <!-- 상세 입력 폼 -->
      <form id="detail-form" onsubmit="saveDetailAndStatus(event)" class="space-y-4">
        <input type="hidden" id="modal-doc-id">

        <!-- 상태 변경 선택 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">처리 상태 <span class="text-rose-500">*</span></label>
          <select id="modal-status" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white font-medium">
            <option value="대기중">대기중</option>
            <option value="수락 완료">수락 완료</option>
            <option value="처리 완료">처리 완료</option>
          </select>
        </div>

        <!-- 토너명 입력 칸 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">토너명 (모델명 입력)</label>
          <input type="text" id="modal-toner-name" maxlength="10" placeholder="예: 67" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>

        <!-- 수량 체크 칸 (BK, C, M, Y 총 4칸) -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">토너 수량 (BK, C, M, Y)</label>
          <div class="grid grid-cols-4 gap-2">
            <div>
              <span class="text-[11px] text-slate-500 block mb-0.5 font-bold">BK (검정)</span>
              <input type="number" id="qty-bk" min="0" value="0" class="w-full px-2 py-1.5 border rounded-lg text-center text-sm">
            </div>
            <div>
              <span class="text-[11px] text-cyan-600 block mb-0.5 font-bold">C (파랑)</span>
              <input type="number" id="qty-c" min="0" value="0" class="w-full px-2 py-1.5 border rounded-lg text-center text-sm">
            </div>
            <div>
              <span class="text-[11px] text-pink-600 block mb-0.5 font-bold">M (빨강)</span>
              <input type="number" id="qty-m" min="0" value="0" class="w-full px-2 py-1.5 border rounded-lg text-center text-sm">
            </div>
            <div>
              <span class="text-[11px] text-amber-600 block mb-0.5 font-bold">Y (노랑)</span>
              <input type="number" id="qty-y" min="0" value="0" class="w-full px-2 py-1.5 border rounded-lg text-center text-sm">
            </div>
          </div>
        </div>

        <!-- 폐토너통 수량 체크 칸 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">폐토너통 수량</label>
          <input type="number" id="modal-waste-toner" min="0" value="0" class="w-full px-3 py-2 border rounded-lg text-sm text-center">
        </div>

        <!-- 카운터 사진 첨부 칸 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">카운터 사진 첨부</label>
          <input type="file" id="modal-counter-image" accept="image/*" onchange="compressAndPreviewImage(event)" class="w-full px-3 py-2 border rounded-lg text-sm bg-white file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <input type="hidden" id="modal-image-base64">
          <div id="image-preview-container" class="mt-2 hidden">
            <img id="image-preview" src="" alt="카운터 사진 미리보기" class="max-h-32 rounded-lg border shadow-sm">
          </div>
        </div>

        <!-- 기타 특이사항 (30자 제한) -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">기타 특이사항 (30자 이내)</label>
          <input type="text" id="modal-remarks" maxlength="30" placeholder="특이사항 입력 (30자 이내)" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium transition">저장 및 반영</button>
          <button type="button" onclick="closeDetailModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm transition">취소</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col gap-6">

    <!-- 접수 입력 폼 카드 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-lg font-semibold mb-4 text-slate-700">새 접수 등록</h2>
      <form id="request-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">거래처명</label>
          <input type="text" id="client-name" required placeholder="예: (주)한국상사" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">접수 내용</label>
          <input type="text" id="request-content" required placeholder="요청 사항 입력" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">연락처</label>
          <div class="flex gap-2">
            <input type="text" id="contact" placeholder="예: 010-1234-5678" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition shrink-0">접수</button>
          </div>
        </div>
      </form>
    </section>

    <!-- 현황판 및 검색 -->
    <section class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
      <!-- 상태 탭 필터 -->
      <div class="flex bg-slate-200 p-1 rounded-xl text-sm font-medium">
        <button type="button" onclick="setFilter('all')" id="tab-all" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg bg-white shadow-sm transition">전체</button>
        <button type="button" onclick="setFilter('대기중')" id="tab-대기중" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition">대기중</button>
        <button type="button" onclick="setFilter('수락 완료')" id="tab-수락 완료" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition">수락완료</button>
        <button type="button" onclick="setFilter('처리 완료')" id="tab-처리 완료" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition">처리완료</button>
      </div>
      <!-- 검색창 -->
      <div>
        <input type="text" id="search-input" oninput="renderList()" placeholder="다중검색 (예: 삼호 26.10)..." class="w-full sm:w-64 px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </section>

    <!-- 접수 목록 카드 리스트 -->
    <section class="flex-1">
      <div id="request-list" class="grid grid-cols-1 gap-3">
        <div class="text-center py-10 text-slate-400 text-sm">서버에 연결 중입니다...</div>
      </div>
    </section>

  </main>

  <!-- 스크립트 로직 -->
  <script>
    let db = null;
    let requestsData = [];
    let currentFilter = 'all';
    let unsubscribe = null;
    let isInitialLoad = true; // 최초 접속 시 로드와 실제 새 접수 구분을 위한 변수

    // 앱 실행 시 저장된 설정값 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      const savedConfig = localStorage.getItem('my_firebase_config');
      if (savedConfig) {
        try {
          const config = JSON.parse(savedConfig);
          initFirebase(config);
        } catch(e) {
          openConfigModal();
        }
      } else {
        openConfigModal();
      }
    });

    function openConfigModal() {
      const savedConfig = localStorage.getItem('my_firebase_config');
      if (savedConfig) {
        try {
          const cfg = JSON.parse(savedConfig);
          document.getElementById('cfg-apiKey').value = cfg.apiKey || '';
          document.getElementById('cfg-authDomain').value = cfg.authDomain || '';
          document.getElementById('cfg-projectId').value = cfg.projectId || '';
          document.getElementById('cfg-storageBucket').value = cfg.storageBucket || '';
          document.getElementById('cfg-messagingSenderId').value = cfg.messagingSenderId || '';
          document.getElementById('cfg-appId').value = cfg.appId || '';
        } catch(e) {}
      }
      document.getElementById('config-modal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('config-modal').classList.add('hidden');
    }

    function saveConfig() {
      const config = {
        apiKey: document.getElementById('cfg-apiKey').value.trim(),
        authDomain: document.getElementById('cfg-authDomain').value.trim(),
        projectId: document.getElementById('cfg-projectId').value.trim(),
        storageBucket: document.getElementById('cfg-storageBucket').value.trim(),
        messagingSenderId: document.getElementById('cfg-messagingSenderId').value.trim(),
        appId: document.getElementById('cfg-appId').value.trim()
      };

      if (!config.apiKey || !config.projectId) {
        alert("API Key와 Project ID는 필수 입력 항목입니다.");
        return;
      }

      localStorage.setItem('my_firebase_config', JSON.stringify(config));
      closeConfigModal();
      initFirebase(config);
    }

    function initFirebase(config) {
      try {
        if (firebase.apps.length > 0) {
          firebase.app().delete().then(() => {
            setupFirestore(config);
          });
        } else {
          setupFirestore(config);
        }
      } catch (error) {
        alert("파이어베이스 초기화 오류: " + error.message);
        openConfigModal();
      }
    }

    // 전자음(Beep 소리) 재생 함수
    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 주파수 설정
        oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.15);

        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.4);
      } catch (e) {
        console.log("오디오 재생 실패:", e);
      }
    }

    // 팝업 알람(토스트) 표시 함수
    function showToast(clientName, content) {
      const toast = document.getElementById('toast-alert');
      const msg = document.getElementById('toast-message');
      msg.innerText = `[${clientName}] ${content}`;

      // 나타나기
      toast.classList.remove('translate-y-[-150%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      // 소리 재생
      playAlarmSound();

      // 4초 뒤 사라지기
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
      }, 4000);
    }

    function setupFirestore(config) {
      firebase.initializeApp(config);
      db = firebase.firestore();

      document.getElementById('connection-status').innerText = '🟢 서버 연결됨';
      document.getElementById('connection-status').className = 'text-xs bg-emerald-500 px-2 py-1 rounded-full';

      if (unsubscribe) unsubscribe();

      let previousLength = 0;

      unsubscribe = db.collection("client_requests").orderBy("createdAt", "desc")
        .onSnapshot((snapshot) => {
          const newData = [];
          snapshot.forEach((doc) => {
            newData.push({ id: doc.id, ...doc.data() });
          });

          // 처음 앱을 켤 때는 알람을 울리지 않고, 이후 새로운 접수 문서가 추가되었을 때만 알람 및 소리 발생
          if (!isInitialLoad && newData.length > previousLength) {
            const latestItem = newData[0]; // 가장 최근에 추가된 항목
            showToast(latestItem.clientName || '신규 거래처', latestItem.content || '요청사항');
          }

          isInitialLoad = false;
          previousLength = newData.length;
          requestsData = newData;
          renderList();
        }, (error) => {
          console.error("Firestore 오류: ", error);
          document.getElementById('connection-status').innerText = '🔴 연결 오류 (설정 확인)';
          document.getElementById('connection-status').className = 'text-xs bg-rose-500 px-2 py-1 rounded-full';
        });
    }

    // 새 접수 등록 제출 이벤트
    document.getElementById('request-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!db) {
        alert("서버에 연결되어 있지 않습니다. 우측 상단 [⚙️ 서버설정]을 확인해주세요.");
        openConfigModal();
        return;
      }

      const clientName = document.getElementById('client-name').value.trim();
      const content = document.getElementById('request-content').value.trim();
      const contact = document.getElementById('contact').value.trim();

      if (!clientName || !content) return;

      db.collection("client_requests").add({
        clientName: clientName,
        content: content,
        contact: contact,
        status: '대기중',
        tonerName: '',
        qtyBk: 0,
        qtyC: 0,
        qtyM: 0,
        qtyY: 0,
        wasteToner: 0,
        imageBase64: '',
        remarks: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('request-form').reset();
      }).catch((error) => {
        alert("등록 실패: " + error.message);
      });
    });

    // 수락하기 버튼 클릭 시: 즉시 '수락 완료' 상태로 변경 후 상세 페이지(모달) 열기
    function handleAccept(id, event) {
      if (event) event.stopPropagation();
      if (!db) return;

      db.collection("client_requests").doc(id).update({
        status: '수락 완료'
      }).then(() => {
        openDetailModal(id);
      }).catch((error) => {
        alert("상태 변경 실패: " + error.message);
      });
    }

    // 사진 자동 압축 및 미리보기 함수
    function compressAndPreviewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          const maxDim = 800;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

          document.getElementById('modal-image-base64').value = compressedDataUrl;
          document.getElementById('image-preview').src = compressedDataUrl;
          document.getElementById('image-preview-container').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 상세 페이지(모달) 열기
    function openDetailModal(id, event) {
      if (event) event.stopPropagation();
      const item = requestsData.find(d => d.id === id);
      if (!item) return;

      document.getElementById('modal-doc-id').value = item.id;
      document.getElementById('modal-client-name').innerText = item.clientName || '-';
      document.getElementById('modal-client-content').innerText = item.content || '-';
      document.getElementById('modal-client-contact').innerText = item.contact || '없음';
      document.getElementById('modal-client-time').innerText = formatTimestamp(item.createdAt);
      
      document.getElementById('modal-status').value = item.status || '수락 완료';
      document.getElementById('modal-toner-name').value = item.tonerName || '';
      document.getElementById('qty-bk').value = (item.qtyBk !== undefined) ? item.qtyBk : 0;
      document.getElementById('qty-c').value = (item.qtyC !== undefined) ? item.qtyC : 0;
      document.getElementById('qty-m').value = (item.qtyM !== undefined) ? item.qtyM : 0;
      document.getElementById('qty-y').value = (item.qtyY !== undefined) ? item.qtyY : 0;
      document.getElementById('modal-waste-toner').value = (item.wasteToner !== undefined) ? item.wasteToner : 0;
      document.getElementById('modal-remarks').value = item.remarks || '';

      document.getElementById('modal-counter-image').value = '';
      const existingImg = item.imageBase64 || '';
      document.getElementById('modal-image-base64').value = existingImg;
      if (existingImg) {
        document.getElementById('image-preview').src = existingImg;
        document.getElementById('image-preview-container').classList.remove('hidden');
      } else {
        document.getElementById('image-preview').src = '';
        document.getElementById('image-preview-container').classList.add('hidden');
      }

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    // 상세 페이지에서 저장하기 누를 때
    function saveDetailAndStatus(e) {
      e.preventDefault();
      if (!db) return;

      const id = document.getElementById('modal-doc-id').value;
      const statusInput = document.getElementById('modal-status').value;
      const tonerName = document.getElementById('modal-toner-name').value.trim();
      const qtyBk = document.getElementById('qty-bk').value;
      const qtyC = document.getElementById('qty-c').value;
      const qtyM = document.getElementById('qty-m').value;
      const qtyY = document.getElementById('qty-y').value;
      const wasteToner = document.getElementById('modal-waste-toner').value;
      const imageBase64 = document.getElementById('modal-image-base64').value;
      const remarks = document.getElementById('modal-remarks').value.trim();

      const finalStatus = (statusInput === '대기중') ? '대기중' : '처리 완료';

      if (finalStatus !== '대기중') {
        if (!tonerName || qtyBk === '' || qtyC === '' || qtyM === '' || qtyY === '' || wasteToner === '' || !imageBase64) {
          alert("⚠️ 필수 입력 항목(토너명, 수량, 폐토너통, 카운터 사진)을 모두 채워야 저장할 수 있습니다!");
          return;
        }
      }

      db.collection("client_requests").doc(id).update({
        status: finalStatus,
        tonerName: tonerName,
        qtyBk: parseInt(qtyBk) || 0,
        qtyC: parseInt(qtyC) || 0,
        qtyM: parseInt(qtyM) || 0,
        qtyY: parseInt(qtyY) || 0,
        wasteToner: parseInt(wasteToner) || 0,
        imageBase64: imageBase64,
        remarks: remarks
      }).then(() => {
        closeDetailModal();
      }).catch((error) => {
        alert("저장 실패: " + error.message);
      });
    }

    // 항목 삭제 함수
    function deleteRequest(id, event) {
      if (event) event.stopPropagation();
      if (!db) return;
      if (confirm("정말 이 접수 내역을 삭제하시겠습니까?")) {
        db.collection("client_requests").doc(id).delete().catch((error) => {
          alert("삭제 실패: " + error.message);
        });
      }
    }

    // 필터 변경 탭 설정
    function setFilter(status) {
      currentFilter = status;
      ['all', '대기중', '수락 완료', '처리 완료'].forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (s === status) {
          btn.className = "flex-1 sm:flex-none px-4 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600 font-semibold transition";
        } else {
          btn.className = "flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition";
        }
      });
      renderList();
    }

    // 날짜 포맷팅 함수
    function formatTimestamp(timestamp) {
      if (!timestamp) return '방금 전';
      const date = timestamp.toDate();
      const yy = String(date.getFullYear()).slice(2);
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      return `${yy}.${mm}.${dd} ${hh}:${min}`;
    }

    // 리스트 렌더링 화면 구성 (다중 키워드 AND 검색 적용)
    function renderList() {
      const listContainer = document.getElementById('request-list');
      const rawSearchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const searchKeywords = rawSearchQuery ? rawSearchQuery.split(/\s+/) : [];

      const filtered = requestsData.filter(item => {
        const matchesFilter = (currentFilter === 'all') || (item.status === currentFilter);
        const formattedDate = formatTimestamp(item.createdAt).toLowerCase();
        const targetText = [
          item.clientName || '',
          item.content || '',
          item.contact || '',
          item.tonerName || '',
          item.remarks || '',
          formattedDate
        ].join(' ').toLowerCase();

        const matchesSearch = searchKeywords.every(keyword => targetText.includes(keyword));
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">등록된 접수 내용이 없습니다.</div>`;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        let badgeColor = 'bg-amber-100 text-amber-700';
        let actionButtonHtml = '';

        if (item.status === '대기중') {
          badgeColor = 'bg-amber-100 text-amber-700';
          actionButtonHtml = `<button onclick="handleAccept('${item.id}', event)" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition">수락하기</button>`;
        } else if (item.status === '수락 완료') {
          badgeColor = 'bg-blue-100 text-blue-700';
          actionButtonHtml = `<button onclick="openDetailModal('${item.id}', event)" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-50 text-blue-600 hover:bg-blue-100 transition">상세보기/수정</button>`;
        } else if (item.status === '처리 완료') {
          badgeColor = 'bg-emerald-100 text-emerald-700';
          actionButtonHtml = `<button onclick="openDetailModal('${item.id}', event)" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">상세보기/수정</button>`;
        }

        const formattedTime = formatTimestamp(item.createdAt);
        
        let contactHtml = '';
        if (item.contact) {
          const escapedContact = escapeHtml(item.contact);
          contactHtml = `
            <a href="tel:${escapedContact}" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 px-2 py-0.5 rounded transition font-medium" title="전화 걸기">
              📞 ${escapedContact}
            </a>
          `;
        }

        let detailsBadge = '';
        if (item.tonerName || item.qtyBk > 0 || item.qtyC > 0 || item.qtyM > 0 || item.qtyY > 0 || item.wasteToner > 0 || item.imageBase64 || item.remarks) {
          detailsBadge = `
            <div class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg mt-1 inline-flex items-center gap-2 flex-wrap font-medium">
              ${item.tonerName ? `<span>🏷️ 토너명: <strong>${escapeHtml(item.tonerName)}</strong></span>` : ''}
              <span>[수량: BK:${item.qtyBk || 0}, C:${item.qtyC || 0}, M:${item.qtyM || 0}, Y:${item.qtyY || 0}]</span>
              <span>🗑️ 폐토너통: ${item.wasteToner || 0}개</span>
              ${item.imageBase64 ? `<span class="text-emerald-600 font-bold">📷 사진첨부됨</span>` : ''}
              ${item.remarks ? `<span>📝 특이사항: ${escapeHtml(item.remarks)}</span>` : ''}
            </div>
          `;
        }

        html += `
          <div onclick="openDetailModal('${item.id}', event)" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:border-indigo-200 transition">
            <div class="space-y-1 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold px-2 py-0.5 rounded-full ${badgeColor}">${item.status}</span>
                <span class="font-bold text-slate-800 text-base">${escapeHtml(item.clientName)}</span>
                ${contactHtml}
                <span class="text-xs text-slate-400">🕒 ${formattedTime}</span>
              </div>
              <p class="text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(item.content)}</p>
              ${detailsBadge}
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              ${actionButtonHtml}
              <button onclick="deleteRequest('${item.id}', event)" class="px-3 py-1.5 rounded-lg text-xs font-medium text-rose-500 bg-rose-50 hover:bg-rose-100 transition">
                삭제
              </button>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
